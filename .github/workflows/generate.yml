name: Generate article

on:
  schedule:
    # Evergreen articles: Mon, Wed, Fri
    - cron: '17 13 * * 1,3,5'
    # News roundup: Tue
    - cron: '7 14 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'evergreen (next topic from the list) or news. Ignored when you give a topic or link.'
        type: choice
        options: [evergreen, news]
        default: evergreen
      topic:
        description: 'Write about this topic (optional). Sent to you for approval as a pull request.'
        type: string
        required: false
      link:
        description: 'Or start from this article link (optional).'
        type: string
        required: false
      notes:
        description: 'Angle or notes for the writer (optional).'
        type: string
        required: false
      category:
        description: 'Category for a requested article (auto lets the writer pick).'
        type: choice
        options: [auto, tutorials, extensions, rendering, workflows, hardware]
        default: auto
      issue:
        description: 'Article request issue number to report back to (set automatically).'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  # Requests run in their own group: a queued run in a shared group would be
  # replaced (and lost) when another request arrived.
  group: ${{ (inputs.topic || inputs.link) && format('request-{0}', github.run_id) || 'generate' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      title: ${{ steps.gen.outputs.title }}
      slug: ${{ steps.gen.outputs.slug }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pick topic
        id: job
        env:
          # "claude-code" (default) bills your Claude subscription; "api" bills an Anthropic API key.
          ENGINE: ${{ vars.ARTICLE_ENGINE || 'claude-code' }}
          REQUEST_TOPIC: ${{ inputs.topic }}
          REQUEST_LINK: ${{ inputs.link }}
          REQUEST_NOTES: ${{ inputs.notes }}
          REQUEST_CATEGORY: ${{ inputs.category != 'auto' && inputs.category || '' }}
        run: |
          NEWS=""
          if [ -z "$REQUEST_TOPIC$REQUEST_LINK" ]; then
            if [ "${{ github.event.schedule }}" = "7 14 * * 2" ] || [ "${{ inputs.mode }}" = "news" ]; then NEWS="--news"; fi
          fi
          echo "news=$NEWS" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          # Topics already waiting for review on an article/* branch aren't picked again.
          PENDING_TOPICS=$(git ls-remote --heads origin 'refs/heads/article/*' | sed 's#.*refs/heads/article/##' | paste -sd, -)
          echo "PENDING_TOPICS=$PENDING_TOPICS" >> "$GITHUB_ENV"
          if [ "$ENGINE" = "claude-code" ]; then node scripts/generate-post.mjs --prepare $NEWS; fi

      - name: Write article with Claude Code
        if: steps.job.outputs.engine == 'claude-code'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Article requests start this workflow from the "Article request"
          # workflow, so the actor is the GitHub Actions bot, not a person.
          allowed_bots: github-actions
          prompt: Read .article/prompt.md and follow its instructions exactly. Finish by writing the article to .article/draft.md.
          claude_args: >-
            --allowedTools "WebSearch,WebFetch,Read,Write,Glob,Grep"
            --max-turns 40
            ${{ vars.CLAUDE_CODE_MODEL && format('--model {0}', vars.CLAUDE_CODE_MODEL) || '' }}

      - name: Validate and save article
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          REQUEST_TOPIC: ${{ inputs.topic }}
          REQUEST_LINK: ${{ inputs.link }}
          REQUEST_NOTES: ${{ inputs.notes }}
          REQUEST_CATEGORY: ${{ inputs.category != 'auto' && inputs.category || '' }}
        run: |
          if [ "${{ steps.job.outputs.engine }}" = "claude-code" ]; then
            node scripts/generate-post.mjs --finalize
          else
            node scripts/generate-post.mjs ${{ steps.job.outputs.news }}
          fi

      - name: Add cover photo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/add-images.mjs

      - name: Verify the site still builds
        run: npm run build

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.gen.outputs.title }}
          TOPIC: ${{ steps.gen.outputs.topic }}
          # "auto" publishes straight to the default branch; "review" opens a PR for you to merge.
          # Articles you ask for (topic or link) always wait for your approval.
          MODE: ${{ (inputs.topic || inputs.link) && 'review' || vars.PUBLISH_MODE || 'auto' }}
          BASE: ${{ github.event.repository.default_branch || github.ref_name }}
          ISSUE: ${{ inputs.issue }}
        run: |
          git config user.name "sketchupwarehouse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts content-queue/topics.json
          git commit -m "New article: $TITLE"
          if [ "$MODE" = "review" ]; then
            BRANCH="article/$TOPIC"
            if [ -n "$(git ls-remote --heads origin "refs/heads/$BRANCH")" ]; then BRANCH="$BRANCH-${{ github.run_id }}"; fi
            git push -u origin "HEAD:refs/heads/$BRANCH"
            BODY=.article/pr.md
            if [ -n "$ISSUE" ]; then printf '\nCloses #%s\n' "$ISSUE" >> "$BODY"; fi
            PR_URL=$(gh pr create --base "$BASE" --head "$BRANCH" --title "New article: $TITLE" --body-file "$BODY")
            echo "pr=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Draft ready for review: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            # Picks up edits made meanwhile (e.g. to the topic list in /admin).
            git pull --rebase origin "$BASE"
            git push origin "HEAD:$BASE"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report back on the request
        if: always() && inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PR_URL: ${{ steps.publish.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE" --body "The draft is ready for your review: $PR_URL

          Merge it to publish, or close it to reject. Merging also closes this issue."
          else
            gh issue comment "$ISSUE" --body "Writing this article failed, so nothing was published. The log explains why: $RUN_URL

          To try again, edit the request if needed and add the \`retry\` label, or open a new request."
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    # Passes FACEBOOK_PAGE_TOKEN through for sharing the new article.
    secrets: inherit

  # Email the owner: a GitHub issue that @mentions them sends a notification
  # email (on by default). Runs after the deploy so the link already works.
  notify:
    needs: [generate, deploy]
    if: needs.generate.outputs.published == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - name: Open "New article" issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.generate.outputs.title }}
          SLUG: ${{ needs.generate.outputs.slug }}
          SHA: ${{ needs.generate.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          SITE: ${{ vars.SITE_URL || 'https://sketchupwarehouse.com' }}
        run: |
          FILE="src/content/posts/$SLUG.md"
          field() { sed -n "/^---$/,/^---$/p" "$FILE" | grep -m1 "^$1:" | sed "s/^$1: *//; s/^['\"]//; s/['\"]$//"; }
          CATEGORY=$(field category)
          DESCRIPTION=$(field description)
          WORDS=$(awk 'f>=2; /^---$/{f++}' "$FILE" | wc -w)
          CREDIT=$(sed -n '/^cover:/,/^[a-z]/p' "$FILE" | grep -m1 '^  credit:' | sed 's/^  credit: *//')
          URL="${SITE%/}/blog/$SLUG/"
          gh label create new-article --color FF3000 --description "Auto-published article, awaiting a quick review" --force >/dev/null
          BODY=$(cat <<EOF
          @$OWNER a new article is live.

          ### [$TITLE]($URL)
          > $DESCRIPTION

          | | |
          |---|---|
          | **Topic** | $CATEGORY |
          | **Length** | about $WORDS words |
          | **Cover photo** | ${CREDIT:-none} |
          | **Commit** | $SHA |

          **Quick review**
          - [ ] Facts, shortcuts and menu names look right
          - [ ] Cover photo fits the article
          - [ ] Nothing to change in [/admin](${SITE%/}/admin/)

          Close this issue when you're happy with it, or comment if something needs fixing.
          EOF
          )
          gh issue create --title "New article: $TITLE" --label new-article --body "$BODY"
