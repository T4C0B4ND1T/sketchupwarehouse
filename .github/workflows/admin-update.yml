name: Update admin editor

# The /admin editor (Sveltia CMS) is pinned to an exact version with an
# integrity hash. Once a month this checks for a new release, verifies the CDN
# file matches the official npm package, and opens a PR with the new pin.
on:
  schedule:
    - cron: '23 9 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin latest Sveltia CMS release
        id: pin
        run: node scripts/update-admin.mjs

      - name: Open pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          BASE: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          BRANCH="admin-editor/$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; skipping."; exit 0
          fi
          git config user.name "sketchupwarehouse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add public/admin/index.html
          git commit -m "Update admin editor to Sveltia CMS $VERSION"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE" --title "Update admin editor to Sveltia CMS $VERSION" \
            --body "Pins /admin to Sveltia CMS $VERSION with a new integrity hash. The workflow checked that the unpkg file is byte-identical to the official npm package. Release notes: https://github.com/sveltia/sveltia-cms/releases"
