name: Deploy site

on:
  push:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Daily rebuild so future-dated (scheduled) posts go live on time.
    - cron: '11 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      new_posts: ${{ steps.new.outputs.posts }}
    # Pushes deploy only from the default branch. (Scheduled runs always use the default branch.)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sketchupwarehouse.com' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_DISPLAY: ${{ vars.PUBLIC_ADSENSE_SLOT_DISPLAY }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          PUBLIC_AMAZON_TAG: ${{ vars.PUBLIC_AMAZON_TAG }}
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
      # Articles and components this deploy makes public, for the Facebook job below. Read
      # before deploying, while the live site still has the old sitemap.
      - name: Find new articles
        id: new
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sketchupwarehouse.com' }}
        run: echo "posts=$(node scripts/facebook-post.mjs --find)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Shares each newly published article on the Facebook Page. Skips quietly
  # until the FACEBOOK_PAGE_TOKEN secret is added (see the README).
  facebook:
    needs: [build, deploy]
    if: needs.build.outputs.new_posts != '' && needs.build.outputs.new_posts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to Facebook
        env:
          NEW_POSTS: ${{ needs.build.outputs.new_posts }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: node scripts/facebook-post.mjs --post
